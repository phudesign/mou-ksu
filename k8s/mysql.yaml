apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: mou
data:
  01-schema.sql: |
    -- MOU Signing System — MySQL 8 / MariaDB 10.4+
    -- Usage: mysql -u root -p mou_db < database/schema.sql

    SET NAMES utf8mb4;

    CREATE TABLE IF NOT EXISTS users (
      id         INT AUTO_INCREMENT PRIMARY KEY,
      username   VARCHAR(100) NOT NULL UNIQUE,
      password   VARCHAR(255) NOT NULL,  -- unused placeholder; login authenticates via LDAP
      fname      VARCHAR(100) NULL,
      lname      VARCHAR(100) NULL,
      `_role`    ENUM('admin','signer') NOT NULL DEFAULT 'signer',
      is_active  BOOLEAN NOT NULL DEFAULT TRUE,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS user_signatures (
      id         INT AUTO_INCREMENT PRIMARY KEY,
      user_id    INT NOT NULL,
      image_path VARCHAR(500) NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS mou_documents (
      id           INT AUTO_INCREMENT PRIMARY KEY,
      title        VARCHAR(300) NOT NULL,
      pdf_path     VARCHAR(500) NOT NULL,  -- relative to UPLOAD_DIR
      signed_pdf_path VARCHAR(500) NULL,   -- set when all boxes are signed
      status       ENUM('pending','in_progress','completed') NOT NULL DEFAULT 'pending',
      visibility   ENUM('public','private') NOT NULL DEFAULT 'private',
      created_by   INT,
      created_at   TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      completed_at TIMESTAMP NULL,
      FOREIGN KEY (created_by) REFERENCES users(id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS mou_signature_boxes (
      id          INT AUTO_INCREMENT PRIMARY KEY,
      mou_id      INT NOT NULL,
      user_id     INT NOT NULL,
      role_name   VARCHAR(100),          -- 'อธิการบดี', 'รองอธิการบดี', 'พยาน'
      page_number INT NOT NULL,
      pos_x       FLOAT NOT NULL,        -- % จากซ้าย
      pos_y       FLOAT NOT NULL,        -- % จากบน
      width       FLOAT NOT NULL,        -- % ของความกว้างหน้า
      height      FLOAT NOT NULL,        -- % ของความสูงหน้า
      is_signed   BOOLEAN NOT NULL DEFAULT FALSE,
      FOREIGN KEY (mou_id)  REFERENCES mou_documents(id) ON DELETE CASCADE,
      FOREIGN KEY (user_id) REFERENCES users(id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS mou_signatures (
      id                   INT AUTO_INCREMENT PRIMARY KEY,
      mou_id               INT NOT NULL,
      box_id               INT NOT NULL UNIQUE,  -- one signature per box
      user_id              INT NOT NULL,
      user_signature_id    INT NULL,
      signature_image_path VARCHAR(500) NOT NULL,
      ip_address           VARCHAR(45),
      signed_at            TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      FOREIGN KEY (mou_id)            REFERENCES mou_documents(id) ON DELETE CASCADE,
      FOREIGN KEY (box_id)            REFERENCES mou_signature_boxes(id) ON DELETE CASCADE,
      FOREIGN KEY (user_id)           REFERENCES users(id),
      FOREIGN KEY (user_signature_id) REFERENCES user_signatures(id) ON DELETE SET NULL
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

    CREATE TABLE IF NOT EXISTS audit_logs (
      id          INT AUTO_INCREMENT PRIMARY KEY,
      user_id     INT NULL,              -- NULL for failed logins with unknown username
      action      VARCHAR(50) NOT NULL,  -- 'login', 'login_failed', 'mou_upload', ...
      target_type VARCHAR(50) NULL,      -- 'mou', 'user', 'signature'
      target_id   INT NULL,
      details     JSON NULL,
      ip_address  VARCHAR(45),
      created_at  TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
      INDEX idx_audit_logs_created_at (created_at),
      INDEX idx_audit_logs_user_id (user_id),
      FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE SET NULL
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
  02-seed.sql: |
    -- Test data for development only.
    -- Login uses LDAP: seed usernames must match real LDAP accounts to sign in.
    -- Usage: mysql -u root -p mou_db < database/seed.sql
    -- The sample MOU expects backend/uploads/pdfs/sample-mou.pdf (create with: cd backend && npm run sample-pdf)

    SET NAMES utf8mb4;

    INSERT INTO users (id, username, password, fname, lname, `_role`) VALUES
      (1, 'admin',       '$2b$10$tpA3OWMMWPLfcW5JC3J7NePXaYu7TlmNaxMwsldmvU82.DXWdC9eO', 'ผู้ดูแล', 'ระบบ',      'admin'),
      (2, 'rector',      '$2b$10$tpA3OWMMWPLfcW5JC3J7NePXaYu7TlmNaxMwsldmvU82.DXWdC9eO', 'สมชาย',   'อธิการบดี',  'signer'),
      (3, 'vice_rector', '$2b$10$tpA3OWMMWPLfcW5JC3J7NePXaYu7TlmNaxMwsldmvU82.DXWdC9eO', 'สมหญิง',  'รองอธิการบดี', 'signer'),
      (4, 'witness',     '$2b$10$tpA3OWMMWPLfcW5JC3J7NePXaYu7TlmNaxMwsldmvU82.DXWdC9eO', 'วิชัย',   'พยาน',       'signer');

    INSERT INTO mou_documents (id, title, pdf_path, status, visibility, created_by) VALUES
      (1, 'MOU ตัวอย่าง — ความร่วมมือทางวิชาการ', 'pdfs/sample-mou.pdf', 'pending', 'private', 1);

    INSERT INTO mou_signature_boxes (mou_id, user_id, role_name, page_number, pos_x, pos_y, width, height) VALUES
      (1, 2, 'อธิการบดี',    1, 10, 70, 25, 10),
      (1, 3, 'รองอธิการบดี', 1, 40, 70, 25, 10),
      (1, 4, 'พยาน',         1, 70, 70, 25, 10);
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: mou
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: mou
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: TZ
              value: Asia/Bangkok
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mou-secrets
                  key: DB_PASS
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mou-secrets
                  key: DB_NAME
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -p"$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: init
          configMap:
            name: mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: mou
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
