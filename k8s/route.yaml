# HTTPRoute สำหรับ MOU (Gateway API / nginx-gateway) — แบบเดียวกับ k8s/mis/route.prod.yaml
# TLS อยู่ที่ Gateway public-gw ใน namespace nginx-gateway
# body size ใช้ ClientSettingsPolicy
# ProxySettingsPolicy (timeout) ใช้ไม่ได้บนคลัสเตอร์นี้ — CRD ยังไม่มี (ต้องมี NGINX Gateway Fabric 2.4+)

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mou-route
  namespace: mou
spec:
  hostnames:
  - mou.ksu.ac.th
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public-gw
    namespace: nginx-gateway
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: web
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-mou-ksu
  namespace: mou
spec:
  hostnames:
  - mou.ksu.ac.th
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: public-gw
    namespace: nginx-gateway
    sectionName: http
  rules:
  - filters:
    - requestRedirect:
        scheme: https
        statusCode: 301
      type: RequestRedirect
    matches:
    - path:
        type: PathPrefix
        value: /
---
# อัปโหลด PDF — ให้ตรงกับ MAX_FILE_SIZE_MB ของ backend
apiVersion: gateway.nginx.org/v1alpha1
kind: ClientSettingsPolicy
metadata:
  name: mou-client-settings
  namespace: mou
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: mou-route
  body:
    maxSize: "50m"
