# คัดลอกเป็น secret.yaml แล้วใส่ค่ารหัสของคลัสเตอร์จริง (อย่า commit secret.yaml)
#   cp secret.example.yaml secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mou-secrets
  namespace: mou
type: Opaque
stringData:
  DB_USER: root
  DB_PASS: mou_dev_password
  DB_NAME: mou_db
  JWT_SECRET: change_this_to_a_long_random_string_min_32_chars
  # ใส่ token จริงถ้าต้องการทดสอบ login ผ่าน LDAP
  LDAP_AUTH_API_TOKEN: ""
