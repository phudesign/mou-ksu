apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mou
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # เปลี่ยน tag ให้ตรง image ที่ push แล้ว
          image: phudesign/mou-web:ksu
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: mou
spec:
  # ผู้ใช้เข้าผ่าน HTTPRoute mou.ksu.ac.th → Gateway public-gw
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      name: http
